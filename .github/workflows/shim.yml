name: Shim (agentinbox-cli)

# Publishes the last agentinbox-cli: the shim in shim/agentinbox-cli, which says "agentinbox is now xaq"
# and runs xaq-cli with the same arguments. Run it by hand (Actions → Shim → Run workflow) once xaq-cli
# has a real release on `latest`; it refuses while `latest` is still the placeholder.
#
# npm trusted publishing (OIDC), like nightly.yml: no npm token is stored anywhere, and npm attaches
# provenance automatically. The trusted publisher for agentinbox-cli on npmjs.com must name wynn-dev/xaq,
# workflow `shim.yml`, no environment. npm matches this file by name.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: shim/agentinbox-cli/package.json). Must be above every agentinbox-cli nightly."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

concurrency:
  group: shim
  cancel-in-progress: false

jobs:
  publish:
    # Only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest # trusted publishing needs a GitHub-hosted runner
    timeout-minutes: 20
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shim/agentinbox-cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1 (same check as nightly.yml).
      - name: Check npm version
        run: |
          current="$(npm --version)"
          echo "npm $current"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map((n) => parseInt(n, 10));
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$current"; then
            npm install -g npm@^11.5.1
            echo "upgraded to npm $(npm --version)"
          fi

      # The shim runs whatever xaq-cli `latest` is: never publish it on top of the placeholder.
      - name: Check that xaq-cli has a real release
        run: |
          latest="$(npm view xaq-cli@latest version)"
          echo "xaq-cli@latest is $latest"
          case "$latest" in
            0.0.0*) echo "::error::xaq-cli@latest is still the placeholder ($latest). Let nightly.yml publish xaq-cli first."; exit 1 ;;
          esac

      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }} # through env, never spliced into the script
        run: npm version "$VERSION" --no-git-tag-version

      # The packed shim must start xaq-cli: `agentinbox --version` prints xaq-cli's version, after the notice.
      - name: Smoke test
        run: |
          tgz="$PWD/$(npm pack --silent)"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$tgz"
          out="$(node node_modules/agentinbox-cli/dist/cli.js --version 2> notice.txt)"
          cat notice.txt
          echo "agentinbox --version → $out"
          grep -q "agentinbox is now xaq" notice.txt
          test "$out" = "$(npm view xaq-cli@latest version)"
          rm -f "$tgz"

      - name: Publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          npm publish --tag latest --access public
          echo "Published agentinbox-cli@$(node -p 'require("./package.json").version') (the shim)" >> "$GITHUB_STEP_SUMMARY"
