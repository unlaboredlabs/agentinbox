name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung test fails the job in minutes instead of holding a runner for 6 h (a full run takes about 2–3 min).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Node (engines), the latest 22.x and the current one. Code extensions need a patched
        # Node (≥ 22.23.2 / 24.18.1, server/extensions/host/spawn.ts): on 22.13 their tests check the refusal, and the
        # sandbox and escape tests run on the "22" and "24" entries.
        node: ["22.13", "22", "24"]
    name: check (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          # Every E2E area is on main: a feature-detection miss must fail, not skip (test/e2e/features.ts).
          E2E_REQUIRE: agents,agent-api,listen-client
      - run: pnpm build
      # The bundled CLI must start on every supported Node version.
      - run: node dist/cli.js --version
