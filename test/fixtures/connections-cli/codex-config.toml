model = "gpt-5.5"

[mcp_servers.agentinbox]
url = "https://mail.example.com/mcp"
http_headers = { Authorization = "Bearer aib_CODEX_FIXTURE_KEY" }
default_tools_approval_mode = "approve"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[mcp_servers.example]
url = "https://mcp.example.com/mcp"
bearer_token_env_var = "EXAMPLE_TOKEN"
tool_timeout_sec = 60

[mcp_servers.region]
url = "https://region.example.com/mcp"
http_headers = { "X-Region" = "us-east-1" }
env_http_headers = { "X-Api-Key" = "REGION_KEY" }

[mcp_servers.docs]
command = "npx"
args = [
  "-y",
  "@upstash/context7-mcp@1.0.0", # pinned
]

[mcp_servers.docs.env]
MY_ENV_VAR = "x"

[profiles.fast]
model = "gpt-5.5-mini"
