# Hermes config like Wynn's (2026-10-16), with made-up secrets.
model:
  default: anthropic/claude-sonnet
  provider: openrouter

mcp_servers:
  xaq:
    url: "https://macbook.tailb10092.ts.net/mcp"
    headers:
      Authorization: "Bearer ${XAQ_API_KEY}"
  whoop:
    url: https://whoop.weish.me/api/mcp
    headers:
      Authorization: "Bearer ${WHOOP_MCP_TOKEN}"
    timeout: 120
  brightspace:
    url: "http://127.0.0.1:8787/mcp"
    headers:
      Authorization: "Bearer ${BRIGHTSPACE_TOKEN}"   # course tools
  hearloom:
    url: http://127.0.0.1:3000/mcp
    headers:
      Authorization: Bearer ${HEARLOOM_TOKEN}
    tools:
      exclude: [delete_recording]
  t3code-macbook:
    url: "http://127.0.0.1:3773"
    auth: oauth
  forge:
    url: 'http://100.104.249.49:3773'
    auth: oauth
    connect_timeout: 30
  playwright:
    command: "npx"
    args: ["-y", "@playwright/mcp@0.0.41", "--headless"]

platform_toolsets:
  telegram: [web, mcp-xaq]
